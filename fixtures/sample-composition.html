<!DOCTYPE html>
<html>
  <head>
    <title>Sample Composition</title>
    <style>
      body { margin: 0; background: black; }
    </style>
    <script>
      console.log("this should never become a text element");
    </script>
  </head>
  <body>

      src="/demo/bg.jpg"
